
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAM+ | Painel Administrativo</title>
  <style>
    body {
      margin: 0;
      padding: 25px;
      background: #10091b;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: #211331;
      border: 1px solid #a87927;
      border-radius: 16px;
    }
    h1 { color: #d8b45a; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #8b50bd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #status { color: #d8b45a; }
  </style>
</head>
<body>
  <main>
    <h1>🦋 UAM+ Admin</h1>
    <p>Painel administrativo da plataforma.</p>
    <p id="status">Faça login para continuar.</p>
    <button id="login">Entrar com Google</button>
    <button id="logout" hidden>Sair</button>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDhQrg_NofWqyNPKkJfOHwmVwSXgjubvWk",
  authDomain: "uam-plus-f4519.firebaseapp.com",
  projectId: "uam-plus-f4519",
  storageBucket: "uam-plus-f4519.firebasestorage.app",
  messagingSenderId: "617099307712",
  appId: "1:617099307712:web:4d99dc73c6cb91f89f1b25",
  measurementId: "G-0LP7M7E9EE"
};
  

    const app = initializeApp(firebaseConfig);
    console.log("Firebase iniciado!");
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const status = document.getElementById("status");
    const login = document.getElementById("login");
    alert("O JavaScript está funcionando!");
    console.log("Botão encontrado:", login);
    const logout = document.getElementById("logout");
login.textContent = "BOTÃO TESTE";
    login.onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        status.textContent = "Erro no login: " + error.message;
      }
    };

    logout.onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      login.hidden = !!user;
      logout.hidden = !user;

      if (!user) {
        status.textContent = "Faça login com sua conta Google.";
        return;
      }

      status.textContent = "Verificando autorização...";

      try {
        const adminDoc = await getDoc(doc(db, "admins", user.uid));

        if (adminDoc.exists()) {
          status.textContent = "Acesso autorizado! Bem-vindo ao painel UAM+.";
        } else {
          status.textContent = "Acesso negado: esta conta não é administradora.";
        }
      } catch (error) {
        status.textContent = "Erro ao verificar acesso: " + error.message;
      }
    });
  </script>
</body>
</html>
